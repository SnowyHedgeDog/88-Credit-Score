<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMLOps</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect x='1' y='12' width='3' height='7' fill='%2335c19c'/%3E%3Crect x='6' y='9' width='3' height='10' fill='%23f1b443'/%3E%3Crect x='11' y='5' width='3' height='14' fill='%23f2615b'/%3E%3Crect x='16' y='1' width='3' height='18' fill='%23f2615b'/%3E%3C/svg%3E">
  <script>
    try { const t = localStorage.getItem("amlops-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#/batches" aria-label="AMLOps home">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <rect x="1" y="12" width="3" height="7" fill="var(--clear)"/>
          <rect x="6" y="9" width="3" height="10" fill="var(--watch)"/>
          <rect x="11" y="5" width="3" height="14" fill="var(--critical)"/>
          <rect x="16" y="1" width="3" height="18" fill="var(--critical)"/>
        </svg>
        <span>AML<b>Ops</b></span>
      </a>
      <nav class="tabs" aria-label="Pages">
        <a href="#/batches" data-page="batches">Batches</a>
        <a href="#/queue" data-page="queue">Alert queue</a>
        <a href="#/account" data-page="account">Account</a>
        <a href="#/flow" data-page="flow">Money flow</a>
        <a href="#/model" data-page="model">Model</a>
      </nav>
      <button class="icon-btn" id="theme" type="button" title="Switch light or dark">Light</button>
    </div>
  </header>
  <div class="strip" id="strip" hidden>
    <div class="strip-inner">
      <label class="row" style="gap:10px"><span class="muted">Batch</span>
        <select id="batch-select" aria-label="Batch"></select>
      </label>
      <div class="counts" id="counts"></div>
      <div class="spacer"></div>
      <div class="clock" id="clock"></div>
    </div>
  </div>
  <main id="view" tabindex="-1"></main>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="Draft suspicious transaction report"></aside>

  <script src="/static/vendor/d3.min.js"></script>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
